[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobigp"
version = "0.1.0"
description = "Jacobi-polynomial basis Gaussian Processes: (alpha, beta) as an automatic function-space constructor"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "torch", "matplotlib"]

[project.optional-dependencies]
# only needed to rebuild the GitHub Pages site from the markdown (docs/build_site.py)
site = ["markdown>=3.6", "pymdown-extensions>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
